import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'androidx.room'
}

// these values used to be used to compute the version name and code, but release to F-Droid requires that those values be set instead of computed
// these guide values are kept for consistency and should be updated with every newly released version to be consistent with version code and name below
def major = 0
def minor = 10
def patch = 2

room {
    schemaDirectory "$projectDir/schemas"
}

android {
    namespace 'app.soundtree'
    compileSdk 37

    defaultConfig {
        applicationId "app.soundtree"
        minSdk 28

        // version code = major * 1_000_000 + minor * 1_000 + patch
        // This used to be computed but F-Droid's version parser works off the text of this file
        versionCode 10002

        // version name also used to be computed but now needs to be explicit: "${major}.${minor}.${patch}"
        versionName "0.10.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // I want to be able to use the debug version with prod data in testing for now so don't do this
            //applicationIdSuffix ".debug"
            //versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    // Strip timestamps from the APK zip entries for reproducibility
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // ViewPager2 for swipe tiles
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    ksp 'androidx.room:room-compiler:2.8.4'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // RecyclerView (tree view)
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // ── Media3 (ExoPlayer + MediaSession) ────────────────────────────────
    implementation "androidx.media3:media3-exoplayer:1.10.0"
    implementation "androidx.media3:media3-session:1.10.0"
    implementation "androidx.media3:media3-ui:1.10.0"
    implementation 'androidx.media:media:1.8.0'

    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}